<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص PWA — وتر</title>
<style>body{font-family:system-ui,sans-serif;max-width:700px;margin:30px auto;padding:0 18px}li{margin:8px 0}.ok{color:green}.bad{color:#c00}</style>
</head>
<body>
<h1>فحص PWA</h1><ul id="r"></ul><p id="m"></p>
<script>
const files=["index.html","manifest.webmanifest","sw.js","storage.js","icon-192.png","icon-512.png","maskable-192.png","maskable-512.png","apple-touch-icon.png","favicon-32.png"];
const r=document.getElementById("r");
Promise.all(files.map(async f=>{try{let x=await fetch("./"+f,{cache:"no-store"}); return [f,x.ok,x.status]}catch(e){return[f,false,0]}})).then(a=>{
 a.forEach(x=>{let li=document.createElement("li");li.className=x[1]?"ok":"bad";li.textContent=(x[1]?"✓ ":"✗ ")+x[0]+" — "+x[2];r.appendChild(li)});
});
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(reg=>{
   document.getElementById("m").textContent="✓ Service Worker مسجل: "+reg.scope;
 }).catch(e=>document.getElementById("m").textContent="✗ Service Worker: "+e);
}else document.getElementById("m").textContent="✗ Service Worker غير مدعوم";
</script>
</body></html>
